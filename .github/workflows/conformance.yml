name: conformance

on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # cryptography is not optional in CI: a skipped signature check
      # would otherwise report a green run that verified nothing.
      - run: pip install jsonschema referencing cryptography
      # First: the archive must be safe to open at all (spec 2.1.1/2.1.2).
      # Every check after this one assumes the container has been vetted.
      - run: python3 conformance/check_container.py
      - run: python3 conformance/run_schema_checks.py
      - run: python3 conformance/check_rotation.py
      - run: python3 conformance/check_archive.py
      - run: python3 conformance/run_sampling_checks.py
      # The profile matrix is checked against the schema by mutation, and
      # Appendix C must still be the generated rendering of it -- a matrix
      # edited by hand in the Markdown is a matrix that no longer binds.
      - run: python3 conformance/check_profiles.py
      # The translation checker is self-tested first: a checker whose failure
      # path is never exercised cannot be distinguished from one that always
      # returns success.
      - run: python3 conformance/check_translations.py --selftest
      - run: python3 conformance/check_translations.py
      - name: examples are sealed with the committed content hash
        run: |
          python3 tools/dsx_seal.py verify examples/rotation-l2
          python3 tools/dsx_seal.py verify examples/continuous-l2
